{% extends "splitter/base.html" %}

{% block css %}
{% load static %}
    <link href="{% static 'css/events.css' %}" rel="stylesheet">
{% endblock %}
{% block body %}
<div class="events-view">
    <h1 class="h1 section-title">Events</h1>
    <div class="section-header">
        <h3 class="section-title">Filter</h3>
        <button class="btn btn-primary" id="addEventButton">+</button>
    </div>

    <!-- Add Event Modal -->
    <div id="addEventModal" class="modal">
        <div class="modal-content">
            <div class="close-button" id="closeEventModal" data-modal-target="addEventModal">&times;</div>

            <div class="newEventContainer">
                <form class="new-event-form" id="modal-event-form">
                    <input type="hidden" id="modalEventId" value="">
                    <textarea class="newEventForm" id="modalNewEvent" placeholder="Name of the event" rows="1"></textarea>

                    <div class="dateSection">
                        <label for="modalEventDate">Start date:</label>
                        <input type="date" id="modalEventDate" class="newEventForm">
                    </div>

                    <div class="participantsSection">
                        <label for="modalParticipants">
                            Participants (comma-separated emails or names):
                        </label>
                        <input type="text" id="modalParticipants" class="newEventForm"
                            placeholder="e.g. alice@example.com, Bob, carol@example.com">
                    </div>
                    <button type="submit" class="colored-button">Create</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Edit Event Modal -->
    <div id="editEventModal" class="modal">
        <div class="modal-content">
            <div class="edit-header-modal">
                <div class="close-button" id="closeEditEventModal" data-modal-target="editEventModal">&times;</div>
                <button id="deleteEventButton" class="delete-event-button">
                    <img src="{% static 'img/trash-can.svg' %}" alt="Delete" class="delete-event-icon" />
                </button>
            </div>
            <textarea id="editEventTextarea" class="darkInput" rows="3"></textarea>
            <div class="edit-modal-footer">
                <button id="saveEditEventButton" class="colored-button">Update</button>
            </div>
        </div>
    </div>

    <!-- Delete Event Modal -->
    <div id="deleteEventModal" class="modal">
        <div class="modal-content">
            <div class="edit-header-modal">
                <div>Are you sure you want to delete this event?</div>
            </div>
            <div class="modal-buttons edit-modal-footer">
                <button id="confirmDeleteButton" class="confirmation-colored-button">Yes</button>
                <button id="cancelDeleteButton" class="colored-button" data-modal-target="deleteEventModal">Cancel</button>
            </div>
        </div>
    </div>

    <div class="eventsContainer">
        {% for event in events %}
        <div class="eventCard" data-event-id="{{ event.id }}">
            <div class="eventCardHeader">
                <h3 class="eventCardTitle">{{ event.name }}</h3>
                <div class="eventCardActions">
                    <button class="editEventButton">Edit</button>
                    <button class="deleteEventButton">Delete</button>
                </div>
            </div>
            <div class="eventCardContent">
                <p class="eventCardDate">{{ event.created_at }}</p>
            </div>
        </div>
        {% endfor %}
    </div>

    <div class="paginationContainer"></div>

</div>

<script type="module" src="{% static 'js/events.js' %}"></script>
{% endblock %}
